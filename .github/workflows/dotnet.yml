name: .NET

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        lfs: true
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    - name: Restore dependencies
      run: dotnet restore TGC.MonoGame.TP/TGC.MonoGame.TP.sln
    - name: Build
      run: dotnet build TGC.MonoGame.TP/TGC.MonoGame.TP.sln --no-restore
    - name: Test
      run: dotnet test TGC.MonoGame.TP/TGC.MonoGame.TP.sln --no-build --verbosity normal
